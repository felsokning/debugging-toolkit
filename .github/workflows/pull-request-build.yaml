name: Build

on:
    pull_request:
        types: [opened, reopened, edited, synchronize, ready_for_review]

jobs:
  build-on-2026:
    runs-on: windows-2025-vs2026
    steps:
        - name: Check out code
          uses: actions/checkout@v7
        - name: Test PowerShell JIT'ing
          run: |
            .\Get-WaitChainAnalysis.ps1 -Process "pwsh" -x64
          shell: pwsh
          working-directory: ${{ github.workspace }}
  build-on-2025:
    runs-on: windows-2025
    steps:
        - name: Check out code
          uses: actions/checkout@v7
        - name: Test PowerShell JIT'ing
          run: |
            .\Get-WaitChainAnalysis.ps1 -Process "pwsh" -x64
          shell: pwsh
          working-directory: ${{ github.workspace }}
  build-on-2022:
    runs-on: windows-2022
    steps:
        - name: Check out code
          uses: actions/checkout@v7
        - name: Test PowerShell JIT'ing
          run: |
            .\Get-WaitChainAnalysis.ps1 -Process "pwsh" -x64
          shell: pwsh
          working-directory: ${{ github.workspace }}
  build-2019:
    runs-on: windows-2022
    steps:
        - name: Check out code
          uses: actions/checkout@v7
        - name: Set up Docker
          uses: docker/setup-docker-action@v5
          with:
            daemon-config: |
              {
                "debug": true,
                "features": {
                  "containerd-snapshotter": true
                }
              }
        - name: Set up QEMU
          uses: docker/setup-qemu-action@v4
        - name: Build Docker Image
          run: |
            docker build -t waitchainanalysis .
  build-on-2019:
    runs-on: windows-2022
    container:
      image: waitchainanalysis:latest
    steps:
        - name: Test PowerShell JIT'ing
          run: |
            .\Get-WaitChainAnalysis.ps1 -Process "pwsh" -x64
          shell: pwsh
          working-directory: ${{ github.workspace }}